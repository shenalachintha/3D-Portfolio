<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1118" />
      <stop offset="100%" stop-color="#1A2330" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#20B2A6" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#20B2A6" stop-opacity="0.42" />
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#20B2A6" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20B2A6" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0.28" />
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" />
  <circle cx="1140" cy="130" r="180" fill="#20B2A6" fill-opacity="0.08" />
  <circle cx="160" cy="620" r="230" fill="#F5A623" fill-opacity="0.08" />
  <rect x="220" y="620" width="840" height="30" rx="15" fill="url(#halo)" opacity="0.4" />

  <!-- Main card -->
  <rect x="140" y="120" width="1000" height="480" rx="36" fill="#0F1720" stroke="#1E2A33" stroke-width="2" />

  <!-- Left: builder -->
  <rect x="180" y="160" width="360" height="360" rx="24" fill="#141F2A" stroke="#20B2A6" stroke-opacity="0.35" />
  <text x="210" y="210" fill="#E7F0F4" font-family="'Segoe UI','Inter',sans-serif" font-size="26" font-weight="800">Build Your Pizza</text>
  <text x="210" y="240" fill="#9BB0BC" font-family="'Segoe UI','Inter',sans-serif" font-size="14">Size • Crust • Sauce • Toppings</text>
  <circle cx="360" cy="340" r="90" fill="#20B2A6" fill-opacity="0.12" />
  <path d="M360 250 A90 90 0 1 1 359.7 250" stroke="#E6F0F4" stroke-width="12" stroke-linecap="round" stroke-dasharray="48 20" />
  <text x="260" y="390" fill="#E6F0F4" font-family="'Segoe UI','Inter',sans-serif" font-size="16" font-weight="700">Spicy Veggie • Thin Crust</text>
  <text x="260" y="416" fill="#9BB0BC" font-family="'Segoe UI','Inter',sans-serif" font-size="13">Add-ons: Jalapeño, Olives, Extra Cheese</text>
  <rect x="240" y="446" width="200" height="12" rx="6" fill="#20B2A6" fill-opacity="0.5" />
  <rect x="240" y="466" width="160" height="12" rx="6" fill="#F5A623" fill-opacity="0.45" />
  <rect x="240" y="486" width="180" height="12" rx="6" fill="#20B2A6" fill-opacity="0.32" />

  <!-- Middle: cart -->
  <rect x="570" y="200" width="260" height="220" rx="20" fill="#162029" stroke="#20B2A6" stroke-opacity="0.28" />
  <text x="600" y="246" fill="#E6F0F4" font-family="'Segoe UI','Inter',sans-serif" font-size="20" font-weight="800">Cart</text>
  <text x="600" y="270" fill="#9BB0BC" font-family="'Segoe UI','Inter',sans-serif" font-size="13">3 items • 2 drinks</text>
  <rect x="600" y="292" width="200" height="12" rx="6" fill="#20B2A6" fill-opacity="0.5" />
  <rect x="600" y="314" width="180" height="12" rx="6" fill="#F5A623" fill-opacity="0.45" />
  <rect x="600" y="336" width="160" height="12" rx="6" fill="#20B2A6" fill-opacity="0.3" />
  <rect x="600" y="358" width="140" height="12" rx="6" fill="#20B2A6" fill-opacity="0.24" />
  <text x="600" y="394" fill="#E6F0F4" font-family="'Segoe UI','Inter',sans-serif" font-size="22" font-weight="800">$42.10</text>
  <text x="600" y="416" fill="#9BB0BC" font-family="'Segoe UI','Inter',sans-serif" font-size="12">incl. delivery & taxes</text>

  <!-- Right: delivery -->
  <rect x="860" y="180" width="220" height="260" rx="20" fill="#11181F" stroke="#1F2C36" stroke-width="2" />
  <text x="890" y="228" fill="#E6F0F4" font-family="'Segoe UI','Inter',sans-serif" font-size="18" font-weight="800">Delivery Live</text>
  <text x="890" y="254" fill="#9BB0BC" font-family="'Segoe UI','Inter',sans-serif" font-size="13">Courier en route • ETA 10m</text>
  <rect x="890" y="280" width="170" height="16" rx="8" fill="#20B2A6" fill-opacity="0.55" />
  <rect x="890" y="308" width="150" height="16" rx="8" fill="#F5A623" fill-opacity="0.45" />
  <rect x="890" y="336" width="170" height="16" rx="8" fill="#20B2A6" fill-opacity="0.34" />
  <rect x="890" y="364" width="150" height="16" rx="8" fill="#20B2A6" fill-opacity="0.26" />

  <!-- CTA -->
  <rect x="900" y="470" width="180" height="50" rx="14" fill="url(#cta)" stroke="#0F1720" stroke-width="2" />
  <text x="940" y="502" fill="#0E141A" font-family="'Segoe UI','Inter',sans-serif" font-size="16" font-weight="800">Place Order</text>
</svg>
