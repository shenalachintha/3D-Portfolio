<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1418" />
      <stop offset="100%" stop-color="#1A2330" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#20B2A6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#20B2A6" stop-opacity="0.38" />
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#20B2A6" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" />
  <circle cx="1120" cy="120" r="170" fill="#20B2A6" fill-opacity="0.08" />
  <circle cx="160" cy="600" r="210" fill="#F5A623" fill-opacity="0.07" />
  <rect x="200" y="620" width="880" height="26" rx="13" fill="#20B2A6" fill-opacity="0.22" />

  <!-- Main container -->
  <rect x="140" y="120" width="1000" height="480" rx="34" fill="#0F1720" stroke="#1E2A33" stroke-width="2" />

  <!-- Builder column -->
  <rect x="180" y="160" width="360" height="360" rx="22" fill="#141F2A" stroke="#20B2A6" stroke-opacity="0.32" />
  <text x="206" y="210" fill="#E7F0F4" font-family="'Segoe UI','Inter',sans-serif" font-size="26" font-weight="800">Build your pizza</text>
  <text x="206" y="238" fill="#9BB0BC" font-family="'Segoe UI','Inter',sans-serif" font-size="14">Size • Crust • Sauce • Toppings</text>

  <circle cx="360" cy="330" r="96" fill="#20B2A6" fill-opacity="0.12" />
  <path d="M360 234 A96 96 0 1 1 359.7 234" stroke="#E6F0F4" stroke-width="12" stroke-linecap="round" stroke-dasharray="52 24" />
  <text x="255" y="388" fill="#E6F0F4" font-family="'Segoe UI','Inter',sans-serif" font-size="16" font-weight="700">Spicy Veggie • Thin crust</text>
  <text x="255" y="414" fill="#9BB0BC" font-family="'Segoe UI','Inter',sans-serif" font-size="13">Jalapeno • Olives • Extra cheese</text>

  <rect x="240" y="446" width="210" height="12" rx="6" fill="#20B2A6" fill-opacity="0.5" />
  <rect x="240" y="468" width="170" height="12" rx="6" fill="#F5A623" fill-opacity="0.45" />
  <rect x="240" y="490" width="190" height="12" rx="6" fill="#20B2A6" fill-opacity="0.32" />

  <!-- Cart column -->
  <rect x="570" y="200" width="260" height="220" rx="20" fill="#162029" stroke="#20B2A6" stroke-opacity="0.26" />
  <text x="598" y="246" fill="#E6F0F4" font-family="'Segoe UI','Inter',sans-serif" font-size="20" font-weight="800">Cart</text>
  <text x="598" y="270" fill="#9BB0BC" font-family="'Segoe UI','Inter',sans-serif" font-size="13">3 items • 2 drinks</text>
  <rect x="598" y="292" width="200" height="12" rx="6" fill="#20B2A6" fill-opacity="0.52" />
  <rect x="598" y="314" width="180" height="12" rx="6" fill="#F5A623" fill-opacity="0.46" />
  <rect x="598" y="336" width="160" height="12" rx="6" fill="#20B2A6" fill-opacity="0.32" />
  <rect x="598" y="358" width="140" height="12" rx="6" fill="#20B2A6" fill-opacity="0.24" />
  <text x="598" y="396" fill="#E6F0F4" font-family="'Segoe UI','Inter',sans-serif" font-size="22" font-weight="800">$42.10</text>
  <text x="598" y="418" fill="#9BB0BC" font-family="'Segoe UI','Inter',sans-serif" font-size="12">Delivery + taxes included</text>

  <!-- Tracking column -->
  <rect x="860" y="180" width="220" height="260" rx="20" fill="#11181F" stroke="#1F2C36" stroke-width="2" />
  <text x="888" y="228" fill="#E6F0F4" font-family="'Segoe UI','Inter',sans-serif" font-size="18" font-weight="800">Live delivery</text>
  <text x="888" y="252" fill="#9BB0BC" font-family="'Segoe UI','Inter',sans-serif" font-size="13">Courier en route • ETA 10m</text>
  <rect x="888" y="276" width="170" height="16" rx="8" fill="#20B2A6" fill-opacity="0.55" />
  <rect x="888" y="304" width="150" height="16" rx="8" fill="#F5A623" fill-opacity="0.45" />
  <rect x="888" y="332" width="170" height="16" rx="8" fill="#20B2A6" fill-opacity="0.34" />
  <rect x="888" y="360" width="150" height="16" rx="8" fill="#20B2A6" fill-opacity="0.26" />

  <rect x="898" y="420" width="184" height="54" rx="16" fill="url(#cta)" stroke="#0F1720" stroke-width="2" />
  <text x="938" y="452" fill="#0E141A" font-family="'Segoe UI','Inter',sans-serif" font-size="16" font-weight="800">Place order</text>
